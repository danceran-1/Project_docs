{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fillary - Сохраняй. Заполняй. Управляй</title>
    <link rel="stylesheet" href="{% static 'main/css/start.css' %}">
</head>
<body>
    <!-- Фоновые элементы -->
    <div class="background-elements">
        <img src="{% static 'main/img/File.png' %}" alt="File" class="bg-element bg-file">
        <img src="{% static 'main/img/BD.png' %}" alt="BD" class="bg-element bg-bd">
        <img src="{% static 'main/img/Install.png' %}" alt="Install" class="bg-element bg-install">
        <img src="{% static 'main/img/Lock.png' %}" alt="Lock" class="bg-element bg-lock">
    </div>

    <!-- Основной контент -->
    <div class="main-container">
        <!-- Логотип и слоган -->
        <div class="header-section">
            <div class="logo-container">
                <img src="{% static 'main/img/Logo2.png' %}" alt="Fillary Logo" class="logo">
                <h1 class="brand-name">Fillary</h1>
            </div>
            <p class="tagline">Сохраняй. Заполняй. Управляй</p>
        </div>

        <!-- Функции -->
        <div class="features-section">
            <div class="feature">
                <div class="feature-icon">
                    <img src="{% static 'main/img/1.png' %}" alt="Store Forms">
                </div>
                <p class="feature-text">Храните формы и заполняйте одним кликом</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">
                    <img src="{% static 'main/img/2.png' %}" alt="Secure">
                </div>
                <p class="feature-text">Безопасная авторизация и защита данных</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">
                    <img src="{% static 'main/img/3.png' %}" alt="Access">
                </div>
                <p class="feature-text">Быстрый доступ с любого устройства</p>
            </div>
        </div>

        <!-- Кнопки действий -->
        <div class="action-buttons">
            <a href="{% url 'registr' %}" class="btn btn-primary">Зарегестрироваться</a>
            <a href="{% url 'about' %}" class="btn btn-secondary">Войти</a>
        </div>
    </div>
</body>
</html>
