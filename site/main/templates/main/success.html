<!DOCTYPE html>
<html>
<head>
    <style>
        .form-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .center-text {
           text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative; /* Для подсказок автодополнения */
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #f5f5f5;
        }
        input:read-only {
            background-color: #eee;
            color: #666;
        }
        .user-data {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .avatar-wrapper {
            width: 150px;
            height: 150px;
            border: 3px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s;
        }

        .avatar-wrapper.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .avatar-wrapper:hover {
            border-color: #888;
            cursor: pointer;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Стили для автодополнения */
        #city-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ccc;
            background-color: white;
            z-index: 1000;
            font-size: 14px;
            border-radius: 0 0 4px 4px;
        }
        #city-suggestions div {
            padding: 5px 10px;
            cursor: pointer;
        }
        #city-suggestions div:hover {
            background-color: #eee;
        }

        /* ===== Темная и светлая темы ===== */

        body.light {
            background-color: #ffffff;
            color: #000000;
        }

        body.dark {
            background-color: #121212;
            color: #f0f0f0;
        }

        body.dark .form-container {
            background-color: #1e1e1e;
            border-color: #444;
        }

        body.dark input[type="text"],
        body.dark input[type="date"],
        body.dark input[type="number"] {
            background-color: #2c2c2c;
            border-color: #555;
            color: #f0f0f0;
        }

        body.dark input:read-only {
            background-color: #2c2c2c;
            color: #888;
        }

        body.dark button {
            background-color: #555;
        }

        body.dark button:hover {
            background-color: #666;
        }
        
        body {
            transition: background-color 0.3s, color 0.3s;
        }


        body.dark .avatar-wrapper {
            border-color: #555;
        }

        body.dark .avatar-wrapper:hover {
            border-color: #888;
        }

        body.dark #city-suggestions {
            background-color: #2c2c2c;
            border-color: #555;
            color: #f0f0f0;
        }

        body.dark #city-suggestions div:hover {
            background-color: #444;
        }
        .theme-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
        }

        .theme-toggle button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-right: 8px;
            transition: transform 0.2s;
        }

        .theme-toggle button:hover {
            transform: scale(1.2);
        }


    </style>
    <script>
    function toggleTheme() {
        const body = document.body;
        const current = body.classList.contains('dark') ? 'dark' : 'light';
        const newTheme = current === 'dark' ? 'light' : 'dark';
        body.classList.remove(current);
        body.classList.add(newTheme);
        localStorage.setItem('theme', newTheme);
    }

    // Применить сохранённую тему при загрузке
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('theme') || 'light';
        document.body.classList.add(saved);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        // --- Автодополнение для города ---
        const input = document.getElementById('city-input');
        const suggestionsBox = document.createElement('div');
        suggestionsBox.id = 'city-suggestions';
        input.parentNode.appendChild(suggestionsBox);

        let timer = null;

        input.addEventListener('input', function () {
            clearTimeout(timer);
            const query = this.value.trim();
            suggestionsBox.innerHTML = '';

            if (query.length < 2) return;

            timer = setTimeout(() => {
                fetch(`/city-autocomplete/?q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        data.forEach(city => {
                            const div = document.createElement('div');
                            div.textContent = city;
                            div.addEventListener('click', () => {
                                input.value = city;
                                suggestionsBox.innerHTML = '';
                            });
                            suggestionsBox.appendChild(div);
                        });
                    });
            }, 300);
        });

        document.addEventListener('click', function (e) {
            if (e.target !== input) {
                suggestionsBox.innerHTML = '';
            }
        });

        // --- Функция для включения редактирования ---
        window.enableEditing = function () {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => input.removeAttribute('readonly'));
            document.getElementById('edit-btn').style.display = 'none';
            document.getElementById('save-btn').style.display = 'inline-block';

            const avatarLabel = document.getElementById('avatar-label');
            avatarLabel.classList.remove('disabled');
        };

        // --- Загрузка аватара ---
        const avatarInput = document.getElementById('avatar-input');
        if (avatarInput) {
            avatarInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.querySelector('.avatar-img').src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // --- Сообщения SweetAlert ---
        {% if messages %}
            {% for message in messages %}
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: '{{ message.tags }}',
                    title: '{{ message|escapejs }}',
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });
            {% endfor %}
        {% endif %}
    });
    function toggleTheme() {
    const body = document.body;
    const currentTheme = body.classList.contains('dark') ? 'dark' : 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    body.classList.remove(currentTheme);
    body.classList.add(newTheme);
    localStorage.setItem('theme', newTheme);
    
    updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const btn = document.getElementById('theme-btn');
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    // Применить сохранённую тему при загрузке
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('theme') || 'light';
        document.body.classList.add(saved);
        updateThemeIcon(saved);
    });

    </script>
</head>
<body>
    <body id="theme-style">
    <h1 class="center-text">Добро пожаловать, {{ username }}!</h1>

    <div class="form-container">
        <form method="post" enctype="multipart/form-data" id="avatar-form">
            {% csrf_token %}

            <input type="file" name="avatar" id="avatar-input" accept="image/*" style="display: none;" onchange="document.getElementById('avatar-form').submit();">

            <div class="avatar-container">
                <label for="avatar-input" class="avatar-wrapper disabled" id="avatar-label">
                    <img src="{{ avatar_url|default:'/media/default_avatar1.jpg' }}" 
                        alt="avatar"
                        class="avatar-img">
                </label>
            </div>
                            
            <div class="form-group">
                <label>Фамилия:</label>
                <input type="text" name="last_name" value="{{ form_data.last_name }}" readonly required>
            </div>
            <div class="form-group">
                <label>Имя:</label>
                <input type="text" name="first_name" value="{{ form_data.first_name }}" readonly required>
            </div>
            <div class="form-group">
                <label>Отчество:</label>
                <input type="text" name="middle_name" value="{{ form_data.middle_name }}" readonly>
            </div>
            <div class="form-group">
                <label>Дата рождения:</label>
                <input type="date" name="birth_date" value="{{ form_data.birth_date }}" readonly required>
            </div>
            <div class="form-group" style="position: relative;">
                <label>Город проживания:</label>
                <input type="text" id="city-input" name="city" value="{{ form_data.city }}" readonly required autocomplete="off">
                <div id="city-suggestions" style="border: 1px solid #ccc; background: white; position: absolute; z-index: 1000;"></div>
            </div>

            <button type="button" id="edit-btn" onclick="enableEditing()">Редактировать</button>
            <button type="submit" id="save-btn" style="display: none;">Сохранить</button>

            
        </form>
        
        <div class="theme-toggle">
            <button id="theme-btn" onclick="toggleTheme()" title="Переключить тему">🌙</button>
        </div>
        
        <button type="submit" name="generate_doc_btn" class="doc-button">📄 Сформировать документ</button>

        
    </div>
</body>
</html>
