<!DOCTYPE html>
<html>
<head>
    <style>
        .form-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .center-text {
           text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .user-data {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1 class="center-text">Добро пожаловать, {{ username }}!</h1>
    <div class="form-container">
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Фамилия:</label>
                <input type="text" name="last_name" required>
            </div>
            <div class="form-group">
                <label>Имя:</label>
                <input type="text" name="first_name" required>
            </div>
            <div class="form-group">
                <label>Отчество:</label>
                <input type="text" name="middle_name">
            </div>
            <div class="form-group">
                <label>Дата рождения:</label>
                <input type="date" name="birth_date" required>
            </div>
            <div class="form-group">
                <label>Город проживания:</label>
                <input type="text" name="city" required>
            </div>

            <button type="submit">Отправить</button>
        </form>

        {% if full_name %}
        <div class="user-data">
            <h3>Данные пользователя:</h3>
            <p><strong>ФИО:</strong> {{ full_name }}</p>
            <p><strong>Дата рождения:</strong> {{ birth_date }}</p>
            <p><strong>Город:</strong> {{ city }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
