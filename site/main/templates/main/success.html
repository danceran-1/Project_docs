{% extends 'main/layout.html' %}

{% block title %}Успешно{% endblock %}

{% block content %}
  <h1>Вы успешно авторизовались, как администратор!</h1>
  <h1>K1</h1>




<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="A">Введите значение A:</label>
    <input type="number" id="A" name="A" required>
    <br>
    <label for="B">Введите значение B:</label>
    <input type="number" id="B" name="B" required>
    <br>
    <label for="file1">Прикрепить файл:</label>
    <input type="file" id="file1" name="file1">
    <input type="submit" value="Отправить">
</form>

<p id="resultK1"></p>

<p id="mark"></p>


  <h1>K2</h1>

  <form>
    {% csrf_token %}
    <label for="A1">Введите значение A:</label>
    <input type="number" id="A1" name="A1" required>
    <br>
    <label for="B1">Введите значение B:</label>
    <input type="number" id="B1" name="B1" required>
    <br>

  </form>

  <p id="resultK2"></p>

  <p id="mark1">
  <h1>K3</h1>
  <form>
    {% csrf_token %}
    <label for="A2">Введите значение A:</label>
    <input type="number" id="A2" name="A2" required>
    <br>
    <label for="B1">Введите значение B:</label>
    <input type="number" id="B2" name="B2" required>
    <br>

  </form>

  <p id="resultK3"></p>

  <p id="mark2"></p>

  <p><a href="{% url 'about' %}?return_to_about=1">Перейти на страницу Регистрации</a></p>

  <script>
    let mark = 0;
    let mark1 = 0;

    function calculateK1() {
      var A = parseFloat(document.getElementById('A').value);
      var B = parseFloat(document.getElementById('B').value);
      var resultK1 = (A / B) * 100;

      document.getElementById('resultK1').innerHTML = 'K1: ' + resultK1.toFixed(2) + '%';

      if (55 <= resultK1 && resultK1 <= 59) {
        mark = 1;
      } else if (60 <= resultK1 && resultK1 <= 64) {
        mark = 3;
      } else if (65 <= resultK1 && resultK1 <= 70) {
        mark = 5;
      }

      document.getElementById('mark').innerHTML = 'Балл: ' + mark;
    }

    function calculateK2() {
      var A1 = parseFloat(document.getElementById('A1').value);
      var B1 = parseFloat(document.getElementById('B1').value);
      var resultK2 = (A1 / B1) * 100;

      document.getElementById('resultK2').innerHTML = 'K2: ' + resultK2.toFixed(2) + '%';

      if (45 <= resultK2 && resultK2 <= 49) {
        mark1 = 1;
      } else if (50 <= resultK2 && resultK2 <= 54) {
        mark1 = 3;
      } else if (55 <= resultK2 && resultK2 <= 60) {
        mark1 = 5;
      }

      document.getElementById('mark1').innerHTML = 'Балл: ' + mark1;
    }
    function calculateK3() {
    var A2 = parseFloat(document.getElementById('A2').value);
    var B2 = parseFloat(document.getElementById('B2').value);
    var resultK3 = (A2 / B2) * 100 * 10;

    document.getElementById('resultK3').innerHTML = 'K3: ' + resultK3.toFixed(2) + '%';

    if (resultK3 == 0) {
      mark2 = 5;
    }  else {
      mark2 = 0;
    }

    document.getElementById('mark2').innerHTML = 'Балл: ' + mark2;
  }

    document.getElementById('A').addEventListener('input', calculateK1);
    document.getElementById('B').addEventListener('input', calculateK1);
    document.getElementById('A1').addEventListener('input', calculateK2);
    document.getElementById('B1').addEventListener('input', calculateK2);
    document.getElementById('A2').addEventListener('input', calculateK3);
    document.getElementById('B2').addEventListener('input', calculateK3);
  </script>
{% endblock %}
