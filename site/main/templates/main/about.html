{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
</head>
<body>
    
    <div class="login-container">
        <div class="login-card">
            <!-- Фоновое изображение формы -->
            <div class="form-background">
                <img src="{% static 'main/img/FrontforRegirtration.png' %}" alt="Form Background" class="form-bg-image">
            </div>
            
            <!-- Содержимое формы поверх изображения -->
            <div class="form-content">
                <!-- Логотип -->
                <div class="logo-section">
                    <img src="{% static 'main/img/Logo.png' %}" alt="Fillary Logo" class="logo">
                </div>
                
                <!-- Заголовок -->
                <h2 class="login-title">Вход</h2>
                
                <!-- Контейнер для ошибок -->
                {% if error_message %}
                <div style="color: red; text-align: center; margin-top: 10px;">{{ error_message }}</div>
                {% endif %}
                
                <!-- Форма входа -->
                <form class="login-form" method="POST" action="{% url 'about' %}">
                    {% csrf_token %}
                    <!-- Поле Email -->
                    <div class="input-group">
                        <input type="email" id="username" name="username" class="input-field" placeholder="Электронная почта" required value="{{ request.POST.email|default:'' }}">
                    </div>
                    
                    <!-- Поле Пароль -->
                    <div class="input-group">
                        <div class="password-container">
                            <input type="password" id="password" name="password" class="input-field" placeholder="Пароль" required>
                            <button type="button" class="password-toggle" id="passwordToggle">
                                <img src="{% static 'main/img/open.png' %}" alt="Показать пароль" class="toggle-icon" id="toggleIcon">
                            </button>
                        </div>
                    </div>
                    
                    <!-- Кнопка входа -->
                    <button type="submit" class="login-button">Войти</button>
                </form>
            </div>
        </div>
    </div>

    <script src="{% static 'main/js/login.js' %}"></script>
</body>
</html>
